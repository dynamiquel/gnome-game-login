name: tests

on:
  push:
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python3-evdev
        run: sudo apt-get update && sudo apt-get install -y python3-evdev
      - name: Run logic self-test
        run: python3 couch-controller.py --self-test
